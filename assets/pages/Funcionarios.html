<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <title>Document</title>
</head>
<body>
    <section id="boxperfil">
        <header>
        <a href="paginaInicialEmpresa.html">
            <img src="../imgs/gravity-ui--arrow-left.svg">
        </a>
        <h3>Equipe</h3>
        </header>
        <main>
            <div class="topoBusca">
                <input type="text" placeholder="Pesquisar funcionário">
                <button class="btnPesquisa">
                    <img src="../imgs/streamline-sharp--magnifying-glass-solid.svg">
                </button>
            </div>
            <section class="listaEquipe">
                <h3>Funcionários pendentes</h3>
                <div class="funcionarioContainer">
                    <div class="funcionario">
                        <div class="dadosFuncionario">
                            <img id="fotoFuncionario" src="../imgs/qlementine-icons--user-16.svg">
                            <p>Kimiko</p>
                        </div>
                        <button class="btnDetalhes">
                            <img src="../imgs/tabler--dots-filled.svg">
                        </button>
                    </div>
                    <div class="actionFuncionario">
                            <button id="aceitarFuncionario">
                                <img src="../imgs/mingcute--check-fill.svg">
                            </button>
                            <button id="recusarFuncionario">
                                <img src="../imgs/boxicons--x-filled.svg">
                            </button>
                    </div>  
                </div>
                <h3>Funcionários</h3>
                <div class="funcionario">
                    <div class="dadosFuncionario">
                        <img id="fotoFuncionario" src="../imgs/qlementine-icons--user-16.svg">
                        <p>Steven Universo</p>
                    </div>
                    <button class="btnDetalhes">
                        <img src="../imgs/tabler--dots-filled.svg">
                    </button>
                </div>
            </section>
        </main>
    </section>
</body>
</html>

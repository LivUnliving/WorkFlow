<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <title>Cadastro</title>
</head>
<body>
    <section id="box">
        <a href="Login.html">
            <img id="voltar" src="../img/gravity-ui--arrow-left.svg">
        </a>
        <h1>Cadastro para empresas:</h1>
        <form id="form" action="" method="POST">
        <h3>E-mail</h3>
        <input type="email">
        <h3>Senha</h3>
        <input type="password">
        <h3>Telefone</h3>
        <input type="tel">
        <h3>Cidade</h3>
        <input type="text">
        <h3>CNPJ</h3>
        <input type="number">
        <button class="btn" id="submit" type="submit">ENTRAR</button>       
        </form>
         
    </section>
    
</body>
</html>
